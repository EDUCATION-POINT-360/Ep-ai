<!DOCTYPE html>
<html lang="en" id="app" class="dark">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<meta name="theme-color"
      content="#09090b">

<title>EP AI — Education Point</title>

<meta name="description"
      content="Education Point AI — Gemini, Groq and OpenRouter AI assistant">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

:root{
    --bg:#09090b;
    --panel:#111114;
    --panel2:#18181b;
    --text:#f4f4f5;
    --muted:#a1a1aa;
    --border:rgba(255,255,255,.09);
    --accent:#ffffff;
    --accentText:#000;
    --user:#202024;
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

html.light{
    --bg:#f7f7f8;
    --panel:#ffffff;
    --panel2:#f4f4f5;
    --text:#18181b;
    --muted:#71717a;
    --border:rgba(0,0,0,.09);
    --accent:#111;
    --accentText:#fff;
    --user:#eeeeef;
    --shadow:0 20px 60px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    font-family:
        Inter,
        "Noto Sans Arabic",
        sans-serif;

    background:var(--bg);
    color:var(--text);

    overflow:hidden;
    -webkit-font-smoothing:antialiased;
}

button,
textarea{
    font-family:inherit;
}

.urdu{
    font-family:
        "Noto Nastaliq Urdu",
        "Noto Sans Arabic",
        serif !important;

    direction:rtl;
    text-align:right;
    line-height:2.15;
}

.background{
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(120,120,255,.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(0,200,255,.06),
            transparent 30%
        );
}

.grid-bg{
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;
    opacity:.035;

    background-image:
        linear-gradient(
            var(--text) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            var(--text) 1px,
            transparent 1px
        );

    background-size:50px 50px;
}

.app-shell{
    height:100dvh;
    width:100%;
    display:flex;
}

.sidebar{
    width:280px;
    height:100%;
    flex-shrink:0;

    background:
        color-mix(
            in srgb,
            var(--panel) 92%,
            transparent
        );

    border-right:1px solid var(--border);

    display:flex;
    flex-direction:column;

    padding:14px;

    z-index:100;

    backdrop-filter:blur(30px);
}

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-300px;
        top:0;
        bottom:0;

        transition:
            left .25s
            cubic-bezier(.22,1,.36,1);

        box-shadow:var(--shadow);
    }

    .sidebar.open{
        left:0;
    }

}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 8px 18px;
}

.brand-logo{
    width:38px;
    height:38px;
    border-radius:13px;
    object-fit:cover;

    background:var(--panel2);
    border:1px solid var(--border);
}

.brand-title{
    font-weight:800;
    font-size:14px;
}

.brand-sub{
    font-size:10px;
    color:var(--muted);
    margin-top:2px;
}

.new-chat{
    width:100%;
    height:46px;

    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    cursor:pointer;
    font-weight:600;
}

.new-chat:hover{
    border-color:
        rgba(255,255,255,.2);
}

.history-title{
    font-size:10px;
    color:var(--muted);

    margin:
        25px 8px 8px;

    text-transform:uppercase;
    letter-spacing:.15em;
}

.history{
    flex:1;
    overflow:auto;
}

.history-item{
    width:100%;

    padding:11px 12px;
    margin-bottom:3px;

    border-radius:11px;
    border:0;

    background:transparent;
    color:var(--text);

    text-align:left;
    font-size:13px;

    cursor:pointer;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.history-item:hover{
    background:var(--panel2);
}

.sidebar-bottom{
    border-top:1px solid var(--border);
    padding-top:10px;
}

.side-action{
    width:100%;

    display:flex;
    align-items:center;
    gap:12px;

    border:0;
    background:transparent;
    color:var(--text);

    padding:11px 10px;

    border-radius:12px;

    cursor:pointer;
    font-size:13px;
}

.side-action:hover{
    background:var(--panel2);
}

.main{
    flex:1;
    min-width:0;
    height:100%;

    display:flex;
    flex-direction:column;
}

.header{
    height:64px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid var(--border);

    background:
        color-mix(
            in srgb,
            var(--bg) 82%,
            transparent
        );

    backdrop-filter:blur(24px);

    z-index:50;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-title{
    font-size:14px;
    font-weight:700;
}

.provider-label{
    display:inline-flex;
    align-items:center;
    gap:5px;

    margin-left:7px;

    font-size:10px;
    color:var(--muted);

    padding:
        4px 7px;

    border:
        1px solid var(--border);

    border-radius:20px;

    background:
        var(--panel2);
}

.provider-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#777;
}

.icon-btn{
    width:38px;
    height:38px;

    border:1px solid transparent;
    background:transparent;

    color:var(--text);

    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.icon-btn:hover{
    background:var(--panel2);
    border-color:var(--border);
}

.mobile-menu{
    display:none;
}

@media(max-width:800px){

    .mobile-menu{
        display:flex;
    }

}

.chat-scroll{
    flex:1;

    overflow-y:auto;
    overflow-x:hidden;

    min-height:0;

    -webkit-overflow-scrolling:touch;
}

.chat-inner{
    width:min(900px,100%);

    margin:auto;

    padding:
        40px 24px 180px;
}

@media(max-width:600px){

    .chat-inner{
        padding:
            24px 12px 160px;
    }

}

.welcome{
    min-height:55vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;
}

.welcome-icon{
    width:68px;
    height:68px;

    border-radius:22px;

    background:var(--panel2);
    border:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:20px;

    box-shadow:var(--shadow);
}

.welcome h1{
    margin:0;

    font-size:
        clamp(
            28px,
            5vw,
            46px
        );

    letter-spacing:-.05em;
}

.welcome p{
    color:var(--muted);

    max-width:580px;

    line-height:1.7;

    margin:
        12px auto 25px;
}

.bento{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    width:100%;
    max-width:760px;
}

.bento-card{
    padding:17px;

    border:1px solid var(--border);
    border-radius:18px;

    background:
        color-mix(
            in srgb,
            var(--panel) 80%,
            transparent
        );

    text-align:left;
    cursor:pointer;
}

.bento-card:hover{
    background:var(--panel2);
}

.bento-card strong{
    display:block;

    font-size:13px;

    margin-top:10px;
}

.bento-card span{
    display:block;

    font-size:11px;

    color:var(--muted);

    margin-top:4px;
}

@media(max-width:600px){

    .bento{
        grid-template-columns:
            1fr 1fr;
    }

}

.message{
    display:flex;
    gap:15px;

    margin:
        0 0 30px;

    width:100%;

    animation:
        messageIn .16s
        cubic-bezier(.22,1,.36,1);
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(4px);
    }

    to{
        opacity:1;
        transform:none;
    }

}

.message.user{
    justify-content:flex-end;
}

.message.user
.message-content{
    max-width:
        min(75%,650px);

    background:var(--user);

    border:1px solid var(--border);

    padding:
        12px 16px;

    border-radius:
        22px 22px 6px 22px;
}

.message.ai{
    align-items:flex-start;
}

.avatar{
    width:34px;
    height:34px;

    flex-shrink:0;

    border-radius:11px;

    background:var(--panel2);
    border:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:center;
}

.message-content{
    min-width:0;

    line-height:1.75;
    font-size:15px;

    overflow-wrap:anywhere;
}

.ai-text{
    min-height:24px;
}

.message-actions{
    display:flex;

    gap:3px;

    margin-top:8px;

    opacity:.55;
}

.message-actions button{
    border:0;

    background:transparent;
    color:var(--muted);

    padding:
        5px 7px;

    border-radius:7px;

    cursor:pointer;

    display:flex;
    align-items:center;
    gap:5px;

    font-size:10px;
}

.message-actions button:hover{
    background:var(--panel2);
    color:var(--text);
}

.ai-text p{
    margin:
        0 0 12px;
}

.ai-text p:last-child{
    margin-bottom:0;
}

.ai-text strong{
    font-weight:700;
}

.ai-text code{
    background:var(--panel2);

    border:1px solid var(--border);

    padding:
        2px 5px;

    border-radius:5px;

    font-size:.9em;
}

.ai-text pre{
    margin:
        14px 0;

    padding:15px;

    border-radius:13px;

    overflow:auto;

    background:#050505;

    border:1px solid var(--border);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size:13px;
    line-height:1.6;

    white-space:pre;

    direction:ltr;
    text-align:left;
}

.thinking{
    display:flex;

    align-items:center;
    gap:7px;

    color:var(--muted);

    font-size:12px;

    min-height:24px;
}

.dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:currentColor;

    animation:
        dot 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes dot{

    0%,70%,100%{
        opacity:.2;
        transform:translateY(0);
    }

    35%{
        opacity:1;
        transform:translateY(-3px);
    }

}

.composer-area{
    position:fixed;

    left:280px;
    right:0;
    bottom:0;

    z-index:40;

    padding:
        12px 20px 22px;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent,
            color-mix(
                in srgb,
                var(--bg) 90%,
                transparent
            ) 35%
        );
}

@media(max-width:800px){

    .composer-area{
        left:0;

        padding:
            10px 10px
            max(12px,env(safe-area-inset-bottom));
    }

}

.composer-wrap{
    width:min(850px,100%);
    margin:auto;

    pointer-events:auto;
}

.composer{
    min-height:58px;

    border:1px solid var(--border);

    background:
        color-mix(
            in srgb,
            var(--panel) 90%,
            transparent
        );

    backdrop-filter:blur(25px);

    border-radius:25px;

    box-shadow:var(--shadow);

    display:flex;
    align-items:flex-end;

    gap:5px;

    padding:7px;
}

textarea{
    flex:1;

    resize:none;

    min-height:42px;
    max-height:180px;

    border:0;
    outline:0;

    background:transparent;
    color:var(--text);

    padding:
        11px 8px;

    font:inherit;
    line-height:1.5;
}

textarea::placeholder{
    color:var(--muted);
}

.tool-btn,
.send-btn,
.stop-btn{
    width:44px;
    height:44px;

    border:0;
    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    cursor:pointer;
}

.tool-btn{
    background:transparent;
    color:var(--muted);
}

.tool-btn:hover{
    background:var(--panel2);
    color:var(--text);
}

.send-btn{
    background:var(--accent);
    color:var(--accentText);
}

.stop-btn{
    background:#ef4444;
    color:white;
}

.composer-bottom{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:
        6px 8px 0;

    color:var(--muted);

    font-size:9px;
}

.disclaimer{
    text-align:center;

    font-size:9px;

    color:var(--muted);

    margin-top:7px;
}

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.5);

    backdrop-filter:blur(3px);

    z-index:90;

    display:none;
}

.overlay.show{
    display:block;
}

.toast{
    position:fixed;

    left:50%;
    bottom:100px;

    transform:
        translateX(-50%)
        translateY(15px);

    opacity:0;

    pointer-events:none;

    z-index:1000;

    background:var(--panel2);

    border:1px solid var(--border);

    color:var(--text);

    padding:
        10px 15px;

    border-radius:12px;

    font-size:12px;

    transition:.2s;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

@media(max-width:600px){

    .header{
        height:58px;
        padding:0 10px;
    }

    .header-title{
        font-size:13px;
    }

    .message{
        gap:9px;
        margin-bottom:24px;
    }

    .message.user
    .message-content{
        max-width:88%;
    }

    .message-content{
        font-size:14px;
    }

    .avatar{
        width:30px;
        height:30px;
    }

    .provider-label{
        display:none;
    }

}

</style>

</head>

<body>

<div class="background"></div>
<div class="grid-bg"></div>

<div id="overlay"
     class="overlay"
     onclick="closeSidebar()"></div>


<div class="app-shell">


<aside id="sidebar"
       class="sidebar">

    <div class="brand">

        <div class="brand-logo"
             style="
                display:flex;
                align-items:center;
                justify-content:center;
             ">

            <i data-lucide="sparkles"
               width="20"></i>

        </div>

        <div>

            <div class="brand-title">
                Education Point AI
            </div>

            <div class="brand-sub">
                Gemini → Groq → OpenRouter
            </div>

        </div>

    </div>


    <button class="new-chat"
            onclick="newChat()">

        <i data-lucide="plus"
           width="17"></i>

        New chat

    </button>


    <div class="history-title">
        Recent chats
    </div>


    <div id="history"
         class="history">
    </div>


    <div class="sidebar-bottom">

        <button class="side-action"
                onclick="toggleTheme()">

            <i data-lucide="sun-moon"
               width="17"></i>

            <span>
                Appearance
            </span>

        </button>


        <button class="side-action"
                onclick="clearHistory()">

            <i data-lucide="trash-2"
               width="17"></i>

            <span>
                Clear history
            </span>

        </button>

    </div>

</aside>


<main class="main">


<header class="header">

    <div class="header-left">

        <button id="mobileMenu"
                class="icon-btn mobile-menu"
                onclick="toggleSidebar()">

            <i data-lucide="menu"></i>

        </button>


        <div>

            <span class="header-title">
                EP AI
            </span>

            <span id="providerLabel"
                  class="provider-label">

                <span class="provider-dot"></span>

                Auto Fallback

            </span>

        </div>

    </div>


    <div class="header-right">

        <button class="icon-btn"
                title="New chat"
                onclick="newChat()">

            <i data-lucide="square-pen"></i>

        </button>

    </div>

</header>


<section id="chatScroll"
         class="chat-scroll">

    <div id="chatInner"
         class="chat-inner">


        <div id="welcome"
             class="welcome">

            <div class="welcome-icon">

                <i data-lucide="sparkles"
                   width="30"></i>

            </div>


            <h1>
                How can I help you?
            </h1>


            <p>
                Education Point AI uses an automatic
                Gemini → Groq → OpenRouter fallback system.
            </p>


            <div class="bento">

                <button class="bento-card"
                        onclick="usePrompt('Explain this topic in simple words')">

                    <i data-lucide="book-open"></i>

                    <strong>
                        Learn
                    </strong>

                    <span>
                        Explain any topic
                    </span>

                </button>


                <button class="bento-card"
                        onclick="usePrompt('Solve this problem step by step')">

                    <i data-lucide="calculator"></i>

                    <strong>
                        Study
                    </strong>

                    <span>
                        Step-by-step solutions
                    </span>

                </button>


                <button class="bento-card"
                        onclick="usePrompt('Translate this into Urdu')">

                    <i data-lucide="languages"></i>

                    <strong>
                        Translate
                    </strong>

                    <span>
                        Multiple languages
                    </span>

                </button>


                <button class="bento-card"
                        onclick="usePrompt('Write a professional response about this topic')">

                    <i data-lucide="pen-line"></i>

                    <strong>
                        Write
                    </strong>

                    <span>
                        Better content
                    </span>

                </button>


                <button class="bento-card"
                        onclick="usePrompt('Give me a detailed summary of this topic')">

                    <i data-lucide="file-text"></i>

                    <strong>
                        Summarize
                    </strong>

                    <span>
                        Clear summaries
                    </span>

                </button>


                <button class="bento-card"
                        onclick="usePrompt('Help me understand this')">

                    <i data-lucide="lightbulb"></i>

                    <strong>
                        Think
                    </strong>

                    <span>
                        Explore ideas
                    </span>

                </button>

            </div>

        </div>


        <div id="messages"></div>

    </div>

</section>


<div class="composer-area">

    <div class="composer-wrap">


        <div id="composer"
             class="composer">

            <button class="tool-btn"
                    title="Clear input"
                    onclick="clearInput()">

                <i data-lucide="paperclip"></i>

            </button>


            <textarea id="prompt"
                      rows="1"
                      maxlength="12000"
                      placeholder="Message EP AI..."
                      oninput="resizeTextarea(this)"
                      onkeydown="handleKey(event)"></textarea>


            <button id="stopBtn"
                    class="stop-btn"
                    style="display:none"
                    onclick="stopGeneration()">

                <i data-lucide="square"
                   fill="currentColor"></i>

            </button>


            <button id="sendBtn"
                    class="send-btn"
                    onclick="sendMessage()">

                <i data-lucide="arrow-up"></i>

            </button>

        </div>


        <div class="composer-bottom">

            <span>
                <span id="charCount">
                    0
                </span>/12000
            </span>

            <span>
                AI can make mistakes. Verify important information.
            </span>

        </div>


        <div class="disclaimer">
            Education Point AI
        </div>

    </div>

</div>


</main>

</div>


<div id="toast"
     class="toast">
</div>


<script>

/* =========================================================
   STATE
========================================================= */

let messages = [];

let generating = false;

let controller = null;

let conversations = [];

try {

    conversations =
        JSON.parse(
            localStorage.getItem(
                "ep_ai_history"
            ) || "[]"
        );

} catch {

    conversations = [];

}


/* =========================================================
   DOM
========================================================= */

const root =
    document.getElementById(
        "app"
    );

const promptEl =
    document.getElementById(
        "prompt"
    );

const messagesEl =
    document.getElementById(
        "messages"
    );

const welcome =
    document.getElementById(
        "welcome"
    );

const chatScroll =
    document.getElementById(
        "chatScroll"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const stopBtn =
    document.getElementById(
        "stopBtn"
    );

const providerLabel =
    document.getElementById(
        "providerLabel"
    );

const historyEl =
    document.getElementById(
        "history"
    );


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadTheme();

        renderHistory();

        lucide.createIcons();

        resizeTextarea(
            promptEl
        );

        promptEl.focus();

    }
);


/* =========================================================
   THEME
========================================================= */

function loadTheme() {

    const theme =
        localStorage.getItem(
            "ep_theme"
        ) || "dark";

    applyTheme(
        theme,
        false
    );

}


function applyTheme(
    theme,
    save = true
) {

    const finalTheme =
        theme === "light"
            ? "light"
            : "dark";

    document.documentElement.className =
        finalTheme;

    root.className =
        finalTheme;

    if(save){

        localStorage.setItem(
            "ep_theme",
            finalTheme
        );

    }

}


function toggleTheme() {

    const light =
        document.documentElement
            .classList
            .contains(
                "light"
            );

    applyTheme(
        light
            ? "dark"
            : "light"
    );

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

    document
        .getElementById(
            "sidebar"
        )
        .classList.toggle(
            "open"
        );

    document
        .getElementById(
            "overlay"
        )
        .classList.toggle(
            "show"
        );

}


function closeSidebar() {

    document
        .getElementById(
            "sidebar"
        )
        .classList.remove(
            "open"
        );

    document
        .getElementById(
            "overlay"
        )
        .classList.remove(
            "show"
        );

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

    if(
        messages.length
    ){

        saveConversation();

    }

    stopGeneration();

    messages = [];

    messagesEl.innerHTML =
        "";

    welcome.style.display =
        "flex";

    providerLabel.innerHTML = `
        <span class="provider-dot"></span>
        Auto Fallback
    `;

    promptEl.value =
        "";

    resizeTextarea(
        promptEl
    );

    closeSidebar();

    promptEl.focus();

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage() {

    if(generating)
        return;

    const text =
        promptEl.value.trim();

    if(!text)
        return;


    messages.push({

        role:
            "user",

        content:
            text

    });


    welcome.style.display =
        "none";


    addMessage(
        "user",
        text
    );


    promptEl.value =
        "";

    resizeTextarea(
        promptEl
    );


    const aiElement =
        addMessage(
            "assistant",
            ""
        );


    generating =
        true;

    sendBtn.style.display =
        "none";

    stopBtn.style.display =
        "flex";


    controller =
        new AbortController();


    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    signal:
                        controller.signal,

                    body:
                        JSON.stringify({
                            messages
                        })

                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        if(
            !response.ok ||
            !data.success
        ){

            let error =
                data.error ||
                "All AI providers are unavailable.";

            if(
                Array.isArray(
                    data.providers
                )
            ){

                error +=
                    "\n\n";

                error +=
                    data.providers
                        .map(
                            item =>
                                `${item.provider}: ${item.error}`
                        )
                        .join(
                            "\n"
                        );

            }

            throw new Error(
                error
            );

        }


        updateProvider(
            data.provider,
            data.model
        );


        updateAIMessage(
            aiElement,
            data.response
        );


        messages.push({

            role:
                "assistant",

            content:
                data.response

        });


        saveConversation();


    } catch(error) {

        if(
            error?.name ===
            "AbortError"
        ){

            updateAIMessage(
                aiElement,
                "Generation stopped."
            );

        }else{

            updateAIMessage(
                aiElement,
                error.message ||
                "Unable to contact the AI server."
            );

        }

    } finally {

        generating =
            false;

        controller =
            null;

        sendBtn.style.display =
            "flex";

        stopBtn.style.display =
            "none";

    }

}


/* =========================================================
   STOP
========================================================= */

function stopGeneration() {

    if(controller){

        try {

            controller.abort();

        } catch {}

    }

    generating =
        false;

    controller =
        null;

    sendBtn.style.display =
        "flex";

    stopBtn.style.display =
        "none";

}


/* =========================================================
   PROVIDER LABEL
========================================================= */

function updateProvider(
    provider,
    model
) {

    providerLabel.innerHTML = `
        <span class="provider-dot"></span>
        ${escapeHTML(provider)}
    `;

    providerLabel.title =
        model
            ? model
            : provider;

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    role,
    text
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "ai"
        );


    if(
        role === "user"
    ){

        const content =
            document.createElement(
                "div"
            );

        content.className =
            "message-content";


        const textDiv =
            document.createElement(
                "div"
            );

        textDiv.className =
            "selectable user-text";


        if(
            isUrdu(text)
        ){

            textDiv.classList.add(
                "urdu"
            );

        }


        textDiv.textContent =
            text;


        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "message-actions";


        actions.innerHTML = `
            <button onclick="copyMessage(this)">
                <i data-lucide="copy"
                   width="13"></i>
                Copy
            </button>
        `;


        content.appendChild(
            textDiv
        );

        content.appendChild(
            actions
        );

        wrapper.appendChild(
            content
        );

    }else{

        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "avatar";

        avatar.innerHTML =
            `
            <i data-lucide="sparkles"
               width="16"></i>
            `;


        const content =
            document.createElement(
                "div"
            );

        content.className =
            "message-content";


        const thinking =
            document.createElement(
                "div"
            );

        thinking.className =
            "thinking";

        thinking.innerHTML = `
            <span>
                EP AI is thinking
            </span>

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        `;


        const textDiv =
            document.createElement(
                "div"
            );

        textDiv.className =
            "ai-text selectable";

        textDiv.style.display =
            "none";


        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "message-actions";


        actions.innerHTML = `
            <button onclick="copyMessage(this)">
                <i data-lucide="copy"
                   width="13"></i>
                Copy
            </button>

            <button onclick="shareMessage(this)">
                <i data-lucide="share-2"
                   width="13"></i>
                Share
            </button>
        `;


        content.appendChild(
            thinking
        );

        content.appendChild(
            textDiv
        );

        content.appendChild(
            actions
        );


        wrapper.appendChild(
            avatar
        );

        wrapper.appendChild(
            content
        );


        wrapper._textDiv =
            textDiv;

        wrapper._thinking =
            thinking;

    }


    messagesEl.appendChild(
        wrapper
    );

    lucide.createIcons();

    scrollBottom();

    return wrapper;

}


/* =========================================================
   UPDATE AI MESSAGE
========================================================= */

function updateAIMessage(
    element,
    text
) {

    if(!element)
        return;


    const textDiv =
        element._textDiv;

    const thinking =
        element._thinking;


    if(!textDiv)
        return;


    if(thinking){

        thinking.style.display =
            "none";

    }


    textDiv.style.display =
        "block";


    if(
        isUrdu(text)
    ){

        textDiv.classList.add(
            "urdu"
        );

    }else{

        textDiv.classList.remove(
            "urdu"
        );

    }


    textDiv.innerHTML =
        formatAIText(
            text
        );


    scrollBottom();

}


/* =========================================================
   SIMPLE MARKDOWN
========================================================= */

function formatAIText(
    text
) {

    let safe =
        escapeHTML(
            text || ""
        );


    const codeBlocks =
        [];


    safe =
        safe.replace(
            /```(?:([a-zA-Z0-9_+-]+)\n)?([\s\S]*?)```/g,
            (
                match,
                language,
                code
            ) => {

                const id =
                    `@@CODE_${codeBlocks.length}@@`;

                codeBlocks.push({

                    language:
                        language || "",

                    code:
                        code

                });

                return id;

            }
        );


    safe =
        safe.replace(
            /`([^`\n]+)`/g,
            "<code>$1</code>"
        );


    safe =
        safe.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


    safe =
        safe.replace(
            /^###\s+(.+)$/gm,
            "<strong>$1</strong>"
        );


    safe =
        safe.replace(
            /^##\s+(.+)$/gm,
            "<strong>$1</strong>"
        );


    safe =
        safe.replace(
            /^#\s+(.+)$/gm,
            "<strong>$1</strong>"
        );


    safe =
        safe.replace(
            /(?:^|\n)((?:[-*]\s+.+(?:\n|$))+)/g,
            block => {

                const items =
                    block
                        .trim()
                        .split("\n")
                        .map(
                            line =>
                                line.replace(
                                    /^\s*[-*]\s+/,
                                    ""
                                )
                        )
                        .filter(Boolean)
                        .map(
                            item =>
                                `<li>${item}</li>`
                        )
                        .join("");

                return `
                    <ul>
                        ${items}
                    </ul>
                `;

            }
        );


    const parts =
        safe.split(
            /\n{2,}/
        );


    safe =
        parts
            .map(
                part => {

                    const trimmed =
                        part.trim();

                    if(
                        trimmed.startsWith(
                            "<ul>"
                        ) ||
                        trimmed.startsWith(
                            "@@CODE_"
                        )
                    ){

                        return part;

                    }

                    return `
                        <p>
                            ${part.replace(
                                /\n/g,
                                "<br>"
                            )}
                        </p>
                    `;

                }
            )
            .join("");


    codeBlocks.forEach(
        (
            block,
            index
        ) => {

            const id =
                `@@CODE_${index}@@`;


            const label =
                block.language
                    ? `
                        <div style="
                            font-size:9px;
                            color:var(--muted);
                            margin-bottom:8px;
                            text-transform:uppercase;
                        ">
                            ${escapeHTML(
                                block.language
                            )}
                        </div>
                    `
                    : "";


            const code =
                `
                <pre>
                    ${label}
                    ${escapeHTML(
                        block.code
                    )}
                </pre>
                `;


            safe =
                safe.replace(
                    id,
                    code
                );

        }
    );


    return safe;

}


/* =========================================================
   HISTORY
========================================================= */

function saveConversation() {

    if(
        !messages.length
    )
        return;


    const firstUser =
        messages.find(
            message =>
                message.role ===
                "user"
        );


    if(!firstUser)
        return;


    const conversation = {

        id:
            Date.now(),

        title:
            firstUser.content.slice(
                0,
                60
            ),

        messages:
            JSON.parse(
                JSON.stringify(
                    messages
                )
            ),

        date:
            Date.now()

    };


    conversations.unshift(
        conversation
    );


    conversations =
        conversations.slice(
            0,
            30
        );


    try {

        localStorage.setItem(
            "ep_ai_history",
            JSON.stringify(
                conversations
            )
        );

    } catch {}


    renderHistory();

}


function renderHistory() {

    historyEl.innerHTML =
        "";


    conversations.forEach(
        conversation => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "history-item";

            button.textContent =
                conversation.title ||
                "Conversation";


            button.onclick =
                () => {

                    loadConversation(
                        conversation
                    );

                    closeSidebar();

                };


            historyEl.appendChild(
                button
            );

        }
    );

}


function loadConversation(
    conversation
) {

    stopGeneration();

    messages =
        JSON.parse(
            JSON.stringify(
                conversation.messages ||
                []
            )
        );


    messagesEl.innerHTML =
        "";

    welcome.style.display =
        "none";


    messages.forEach(
        message => {

            addMessage(
                message.role,
                message.content
            );

        }
    );

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory() {

    if(
        !confirm(
            "Clear all saved conversations?"
        )
    )
        return;


    conversations = [];

    messages = [];

    messagesEl.innerHTML =
        "";

    welcome.style.display =
        "flex";


    try {

        localStorage.removeItem(
            "ep_ai_history"
        );

    } catch {}


    renderHistory();

    toast(
        "History cleared"
    );

}


/* =========================================================
   COPY
========================================================= */

async function copyMessage(
    button
) {

    const message =
        button.closest(
            ".message"
        );


    const target =
        message?.querySelector(
            ".user-text,.ai-text"
        );


    const text =
        target?.innerText ||
        "";


    if(!text)
        return;


    try {

        await navigator.clipboard.writeText(
            text
        );

        toast(
            "Copied"
        );

    } catch {

        toast(
            "Copy failed"
        );

    }

}


/* =========================================================
   SHARE
========================================================= */

async function shareMessage(
    button
) {

    const message =
        button.closest(
            ".message"
        );


    const target =
        message?.querySelector(
            ".ai-text"
        );


    const text =
        target?.innerText ||
        "";


    if(!text)
        return;


    if(
        navigator.share
    ){

        try {

            await navigator.share({

                title:
                    "Education Point AI",

                text

            });

            return;

        } catch {}

    }


    try {

        await navigator.clipboard.writeText(
            text
        );

        toast(
            "Copied to clipboard"
        );

    } catch {}

}


/* =========================================================
   PROMPTS
========================================================= */

function usePrompt(
    text
) {

    promptEl.value =
        text;

    resizeTextarea(
        promptEl
    );

    promptEl.focus();

}


/* =========================================================
   TEXTAREA
========================================================= */

function resizeTextarea(
    element
) {

    element.style.height =
        "auto";

    element.style.height =
        Math.min(
            element.scrollHeight,
            180
        ) + "px";


    document
        .getElementById(
            "charCount"
        )
        .textContent =
            element.value.length;

}


function clearInput() {

    promptEl.value =
        "";

    resizeTextarea(
        promptEl
    );

    promptEl.focus();

}


/* =========================================================
   KEYBOARD
========================================================= */

function handleKey(
    event
) {

    if(
        event.key ===
        "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================================
   URDU
========================================================= */

function isUrdu(
    text
) {

    return /[\u0600-\u06FF]/.test(
        text || ""
    );

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom() {

    requestAnimationFrame(
        () => {

            chatScroll.scrollTo({

                top:
                    chatScroll.scrollHeight,

                behavior:
                    "smooth"

            });

        }
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer =
    null;


function toast(
    text
) {

    const element =
        document.getElementById(
            "toast"
        );


    element.textContent =
        text;


    element.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2400
        );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   FINAL
========================================================= */

lucide.createIcons();

</script>
